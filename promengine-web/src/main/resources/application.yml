# =====================================================
# PromEngine + Aeon 全域认知记忆系统 配置文件
# =====================================================

spring:
  mvc:
    async:
      request-timeout: 120000
  mandatory-file-encoding: UTF-8
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: true
        model:  qwen2.5:14b #gemma4-custom:q4
      embedding:
        enabled: true
        model: nomic-embed-text
    vectorstore:
      chroma:
        host: http://localhost
        port: 8000
        collection-name: aeon_memories
        initialize-schema: true

  application:
    name: promengine
  profiles:
    active: aeon,dev
  main:
    banner-mode: CONSOLE
    allow-bean-definition-overriding: true

# -------------------------------------------------
# PromEngine 核心配置
# -------------------------------------------------
promengine:
  data-dir: D:/promengine-data
  mode: carbon

  cognition:
    mode: ${promengine.mode}
    carbon-fuel:
      enabled: true
      max-fuel: 100
      recovery-per-hour: 10
      boost-limit-per-day: 3
      boost-amount: 30

  models:
    providers:
      - id: local-ollama
        type: ollama
        endpoint: http://localhost:11434
        models:
          - name: qwen2.5:14b
            cost-per-1k-tokens: 0.0
          - name: qwen2.5:14b #gemma4-custom:q4
            cost-per-1k-tokens: 0.0
    routing:
      strategy: semantic-budget-aware
      fallback-chain:
        - local-ollama
    circuit-breaker:
      failure-threshold: 5
      timeout: 180
      half-open-max-requests: 3

  orchestrator:
    mode: REACT
    max-steps: 8
    tool-use-enabled: true
    verbose-logging: true
    lm-retry-max: 2          # LLM 超时重试次数
    llm-retry-delay-ms: 1000  # 重试间隔（毫秒）
    sandbox:
      type: WASM  #沙箱
  prompt:
    templates-path: ./configs/prompts/
    default-template: default
    compression:
      enabled: true
      target-max-tokens: 7000

  neuro:
    thinking-ripple-enabled: true
    ripple-sync-mode: chunk-aligned

  temporal:
    enabled: true

  event-log:
    rotation: daily
    compress: true
    retention-days: 90
#  缓存配置
  cache:
    regions:
      agentState:
        max-size: 2000
        ttl-seconds: 1800
      groupState:
        max-size: 1000
        ttl-seconds: 1800
  ecosystem:
    jin10:
      enabled: true
      server-url: https://mcp.jin10.com/mcp
      api-key: sk-XKP95GTkdSxeiMzfTwYzKyiRzechIbi5lAzpsJKOqs0
      timeout: 30
      protocol-version: "2025-11-25"

  mcp:
    builtin-servers:
      - id: jin10
        name: 金十数据
        url: https://mcp.jin10.com/mcp
        enabled: true
        transport: sse
        auth-token: sk-XKP95GTkdSxeiMzfTwYzKyiRzechIbi5lAzpsJKOqs0
        headers:
          Content-Type: application/json
          MCP-Protocol-Version: "2025-11-25"
  devtools:
    shadow-mode-enabled: false   # 默认关闭
      # 可继续添加其他 MCP 服务器
      # - id: filesystem
      #   name: 本地文件系统
      #   transport: stdio
      #   command: npx
      #   args: "-y,@modelcontextprotocol/server-filesystem /tmp"
# -------------------------------------------------
# Aeon 记忆系统配置
# -------------------------------------------------
aeon:
  memory:
    meta-policy-path: ./config/meta-policies.json
    retrieval:
      deduplication-enabled: true
      verified-weight-boost: 1.5
      default-top-k: 10
      cross-domain:
        strategies: [parallel, augment, bridge]
    evolution:
      decay-enabled: true
      decay-cron: "0 0 3 * * ?"
      tame:
        enabled: true
      memevolve:
        enabled: false
    governance:
      enabled: true
      audit:
        enabled: true
        log-path: ${promengine.data-dir}/audit/memory
    vector:
      engine: chroma
      dimension: 768
      milvus-host: localhost
      milvus-port: 19530
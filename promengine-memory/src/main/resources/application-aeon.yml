aeon:
  memory:
    # 元策略配置文件路径
    meta-policy-path: ./config/meta-policies.json

    # 检索配置
    retrieval:
      deduplication-enabled: true
      verified-weight-boost: 1.5
      default-top-k: 10
      enhancement-pipelines:
        - name: zero-llm
          steps: []
        - name: light-llm
          steps:
            - type: query-rewrite
              llm-enabled: true
              model: gemma4-custom:q4
        - name: deep-llm
          steps:
            - type: intent-parse
              llm-enabled: true
            - type: query-expansion
              llm-enabled: true
            - type: re-ranking
              llm-enabled: false
      cross-domain:
        strategies:
          - parallel
          - augment
          - bridge

    # 进化配置
    evolution:
      decay-enabled: true
      decay-cron: "0 0 3 * * ?"
      tame:
        enabled: true
        evaluator-memory-size: 10000
      memevolve:
        enabled: false
        schedule: "0 0 3 * * SUN"

    # 治理配置
    governance:
      enabled: true
      audit:
        enabled: true
        log-path: ${promengine.data-dir}/audit/memory

    # 向量存储配置
    vector:
      engine: chroma          # chroma 或 milvus
      dimension: 768
      milvus-host: localhost
      milvus-port: 19530
      collection-name: aeon_memories
    graph:
      enabled: true
      uri: bolt://localhost:7687
      username: neo4j
      password: neo4j